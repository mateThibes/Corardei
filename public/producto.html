<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Corardei — Producto</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav>
        <a href="/home" class="logo">
            <img src="images/logo_png.png" alt="Corardei Logo" class="logo-img">
            <span class="logo-text">Corardei</span>
        </a>
        <ul class="nav-links">
            <li><a href="/home">El Santo Rosario</a></li>
            <li><a href="/productos" class="active">Productos</a></li>
            <li><a href="/acerca-de">Acerca de nosotros</a></li>
        </ul>
        <div class="nav-quote">
            "Contemplar con María el rostro de Cristo."
        </div>
    </nav>

    <main class="product-detail-main">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
            <a href="/productos">Productos</a>
            <span class="breadcrumb-sep">›</span>
            <span id="breadcrumb-category">Rosarios</span>
            <span class="breadcrumb-sep">›</span>
            <span id="breadcrumb-name">Producto</span>
        </nav>

        <div class="product-detail-layout">
            <!-- LEFT: Gallery -->
            <section class="gallery-section">
                <div class="gallery-container">
                    <div class="gallery-thumbnails" id="gallery-thumbnails">
                        <!-- Populated by JS -->
                    </div>
                    <div class="gallery-main-wrapper">
                        <div class="gallery-main" id="gallery-main">
                            <img src="" alt="Producto" id="gallery-main-img" class="gallery-main-img">
                        </div>
                        <div class="zoom-result" id="zoom-result"></div>
                    </div>
                </div>
            </section>

            <!-- RIGHT: Product Info -->
            <section class="product-info-section">
                <h1 class="product-detail-name" id="product-name">Producto</h1>

                <div class="product-detail-price-block">
                    <span class="product-detail-price" id="product-price">$10.000</span>
                    <span class="product-detail-price-note" id="product-price-note">cada uno</span>
                </div>
                <p class="product-detail-price-alt" id="product-price-alt"></p>

                <div class="product-detail-promo" id="product-promo">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1l1.8 3.6L14 5.3l-3 2.9.7 4.1L8 10.4 4.3 12.3l.7-4.1-3-2.9 4.2-.7L8 1z" fill="currentColor"/></svg>
                    <span id="product-promo-text"></span>
                </div>

                <hr class="product-detail-divider">

                <p class="product-detail-description" id="product-description"></p>

                <!-- Variants -->
                <div class="product-detail-variants" id="product-variants-section">
                    <h3 class="product-detail-variants-title">Variantes disponibles</h3>
                    <div class="product-detail-variant-list" id="product-variants">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Details -->
                <div class="product-detail-specs">
                    <h3 class="product-detail-specs-title">Lo que tenés que saber</h3>
                    <ul class="product-detail-specs-list" id="product-details">
                        <!-- Populated by JS -->
                    </ul>
                </div>

                <hr class="product-detail-divider">

                <!-- CTA -->
                <a href="https://www.instagram.com/corardei?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="cta-instagram" id="cta-instagram">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm3.98-10.181a1.44 1.44 0 11-2.88 0 1.44 1.44 0 012.88 0z"/>
                    </svg>
                    Consultanos por Instagram
                </a>

                <a href="/productos" class="product-detail-back">
                    ← Volver a productos
                </a>
            </section>
        </div>
    </main>

    <a href="https://www.instagram.com/corardei?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="instagram-float" aria-label="Visítanos en Instagram">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm3.98-10.181a1.44 1.44 0 11-2.88 0 1.44 1.44 0 012.88 0z"/>
        </svg>
    </a>

    <script src="/product-data.js"></script>
    <script src="/product-detail.js"></script>
</body>
</html>
